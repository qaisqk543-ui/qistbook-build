name: Build QistBook APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'

      - name: Flutter pub get
        run: flutter pub get

      - name: Patch old plugins (add namespace)
        run: |
          # Fix pdf_render and other old plugins missing namespace for AGP 8.x
          find ~/.pub-cache/hosted/pub.dev -name "build.gradle" -path "*pdf_render*" | while read f; do
            if ! grep -q "namespace" "$f"; then
              echo "Patching $f"
              # Add namespace to android block
              python3 -c "
import re
with open('$f', 'r') as fp:
    c = fp.read()
if 'namespace' not in c:
    c = c.replace('android {', 'android {\n    namespace \"com.example.pdf_render\"', 1)
    with open('$f', 'w') as fp:
        fp.write(c)
    print('Patched')
"
            fi
          done

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qistbook-apk
          path: build/app/outputs/flutter-apk/app-release.apk
