name: Build QistBook APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'

      - name: Flutter pub get
        run: flutter pub get

      - name: Patch pdf_render namespace
        run: |
          PUB_CACHE=~/.pub-cache/hosted/pub.dev
          for d in "$PUB_CACHE"/pdf_render-*; do
            f="$d/android/build.gradle"
            if [ -f "$f" ] && ! grep -q "namespace" "$f"; then
              echo "Patching $f"
              sed -i 's/android {/android {\n    namespace "com.example.pdf_render"/' "$f"
            fi
          done

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qistbook-apk
          path: build/app/outputs/flutter-apk/app-release.apk
