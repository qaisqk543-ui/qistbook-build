name: kistbook
description: Kist Book - installment (qist) management app for shops.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  # OCR - on-device text recognition for scanning printed pages
  google_mlkit_text_recognition: ^0.13.1
  # Pick images (camera/gallery) and PDF files
  image_picker: ^1.0.7
  file_picker: ^6.1.1
  # Render PDF pages to images so OCR can read them
  pdf_render: ^1.4.0
  # Firebase: login (phone OTP / email) + private per-user cloud sync
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  # Local database (offline cache; Firestore is the source of truth)
  sqflite: ^2.3.2
  path: ^1.8.3
  path_provider: ^2.1.2
  # Open WhatsApp chats + phone dialer
  url_launcher: ^6.2.4
  # Send SMS directly from the phone (Android)
  telephony: ^0.2.0
  # Internet check + data-saver setting (social packages)
  connectivity_plus: ^6.1.0
  shared_preferences: ^2.3.2
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
